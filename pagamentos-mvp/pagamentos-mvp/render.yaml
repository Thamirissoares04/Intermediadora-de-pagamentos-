services:
  - type: web
    name: pagamentos-api
    runtime: docker
    plan: free
    dockerfilePath: ./pagamentos-mvp/Dockerfile
    dockerContext: ./pagamentos-mvp
    healthCheckPath: /health
    envVars:
      - key: PAY_API_KEY
        generateValue: true
      - key: PAY_WEBHOOK_SECRET
        generateValue: true
      - key: PAY_ALLOWED_ORIGIN
        sync: false
